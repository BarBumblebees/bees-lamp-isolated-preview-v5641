<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"><title>BEES POINT NFC | ML40 R33E 隔離統合プレビュー</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f1;color:#23362b;font-family:system-ui,-apple-system,sans-serif}main{max-width:530px;margin:0 auto;padding:18px 14px 50px}h1{font-size:24px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}.card{background:#fff;border:1px solid #dfe8e0;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 8px 25px #1d45310d}label{display:block;font-size:14px;font-weight:700;margin-top:12px}input,select{display:block;width:100%;border:1px solid #a5b6ab;border-radius:10px;padding:12px;font:inherit;margin-top:6px;background:#fff;color:inherit}button{border:0;border-radius:10px;background:#184b3d;color:white;padding:12px 15px;font:inherit;font-size:14px;font-weight:700;margin-top:12px;min-height:44px;cursor:pointer}button.secondary{background:#edf4ef;color:#174839}button:disabled{opacity:.5}.hint{font-size:13px;line-height:1.7;color:#52665a}.actionsRow{display:flex;gap:8px;flex-wrap:wrap}.actionsRow button{flex:1}.operationSummary{background:#edf7ef;border:1px solid #bfd7c7;border-radius:10px;padding:13px;font-weight:700;line-height:1.6}.subtle{background:#f7faf7;border:1px solid #dfe8e0;border-radius:10px;padding:10px;min-height:40px;font-size:13px}.notice{background:#fff4dc;border:1px solid #ebca8c;border-radius:12px;padding:12px;font-size:13px;line-height:1.7}#ml40c-count{margin:8px 0}#ml40c-rows td:first-child{width:35%;font-variant-numeric:tabular-nums}#ml40c-rows button{white-space:normal;overflow-wrap:anywhere}#ml40c-history p{border-bottom:1px solid #dfe8e0;padding-bottom:8px;font-size:13px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d6b56e;outline-offset:2px}[hidden]{display:none!important}</style></head><body><main><h1>BEES POINT NFC</h1><p class="notice"><strong>R33E・完全オフライン模擬試験</strong><br>架空会員120名、架空店舗2店。本物のログインやカードは不要です。NFC・QRは模擬読取、メモは表示のみ。残高・受付はこの画面内だけで保持し、再読み込みでリセットします。</p><section class="card" id="ml40c-entry"><h2>ML40 会員操作・統合プレビュー（R33E）</h2><p class="hint">オフラインの架空データのみ。実カード、ログイン情報、実残高を使用しません。</p><button id="ml40c-open" type="button">統合プレビューを開く</button>
<div id="ml40c-panel" hidden><button id="ml40c-close" type="button" class="secondary">閉じる</button><label>操作店舗<select id="ml40c-store"></select></label><div class="actionsRow"><button id="ml40c-nfc" type="button">NFC読取（模擬）</button><button id="ml40c-qr" type="button">QR読取（模擬）</button></div><button id="ml40c-toggle" type="button" class="secondary">メンバー一覧</button>
<div id="ml40c-list" hidden><label>会員番号・ニックネーム<input id="ml40c-search" autocomplete="off" placeholder="例：910119"></label><p id="ml40c-count" class="hint" role="status"></p><div id="ml40c-scroll" style="max-height:350px;overflow:auto;border:1px solid #dfe8e0;border-radius:10px"><table style="width:100%;border-collapse:collapse"><thead style="position:sticky;top:0;background:#edf4ef"><tr style="height:42px"><th>No.</th><th>ニックネーム</th></tr></thead><tbody id="ml40c-rows"></tbody></table></div></div>
<div id="ml40c-detail" hidden><p id="ml40c-summary" class="operationSummary"></p><label>メモ（表示のみ）<input id="ml40c-memo" readonly></label><div class="actionsRow"><button id="ml40c-visit" type="button">来店ポイント</button><button id="ml40c-encounter" type="button">遭遇 +1pt</button></div><label>税込会計総額<input id="ml40c-total" type="number" min="1" inputmode="numeric"></label><label>利用ポイント<input id="ml40c-redeem" type="number" min="0" step="10" value="0"></label><p id="ml40c-approval" class="subtle"></p><button id="ml40c-confirm" type="button" class="secondary">会計内容を確認</button><button id="ml40c-commit" type="button">模擬会計を確定</button><h3>履歴</h3><div id="ml40c-history"></div></div><label><input id="ml40c-loss" type="checkbox" style="display:inline;width:auto"> 次の模擬操作で応答消失を再現</label><button id="ml40c-recover" type="button" hidden>未照合の模擬受付を確認</button><p id="ml40c-status" role="status" class="hint"></p></div></section>
<style>#ml40c-entry [hidden]{display:none!important}#ml40c-rows tr{height:56px;border-bottom:1px solid #dfe8e0}#ml40c-rows td{padding:4px 8px;overflow-wrap:anywhere}#ml40c-rows .member-select{margin:0;min-height:44px;width:100%;text-align:left}#ml40c-rows .member-jump-target{background:#fff4dc}</style>
