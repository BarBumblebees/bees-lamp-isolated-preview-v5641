name: STEP16 disposable PostgreSQL
on:
  push:
    branches: [step16-disposable-postgres]
    paths: ['.github/workflows/step16-disposable.yml']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: step16
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Verify independent sessions
        env:
          PGPASSWORD: disposable_test_only
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGUSER=postgres PGDATABASE=step16
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
          psql -v ON_ERROR_STOP=1 -c 'SELECT pg_advisory_lock(1616), pg_sleep(15);' &
          holder=$!
          trap 'kill "$holder" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if [ "$(psql -At -c "SELECT count(*) FROM pg_locks WHERE locktype='advisory' AND granted AND objid=1616")" = 1 ]; then break; fi
            sleep 0.2
          done
          test "$(psql -At -c 'SELECT pg_try_advisory_lock(1616);')" = f
          wait "$holder"
          test "$(psql -At -c 'SELECT pg_try_advisory_lock(1616);')" = t
          echo 'PASS: independent sessions and lock release'
