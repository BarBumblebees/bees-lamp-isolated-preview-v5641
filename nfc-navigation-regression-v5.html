<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEES NFC 隔離画面遷移チェック</title><style>body{font:16px system-ui;background:#17191f;color:#f6f6f6;max-width:650px;margin:0 auto;padding:20px}section{background:#292c34;border-radius:12px;padding:20px;margin:12px 0}button{padding:13px;background:#ffd35d;border:0;border-radius:8px;font:inherit;margin:5px;cursor:pointer}button:focus-visible{outline:3px solid white}pre{white-space:pre-wrap;background:#111;padding:12px;border-radius:8px}strong{color:#ffcf78}</style><h1>🐝 NFC専用画面・隔離遷移テスト</h1><p><strong>注意：</strong>v5本体ではなく、画面遷移と顧客切替時の表示分離を検証する独立モックです。通信・認証・NFC読取・ポイント更新は実装していません。</p><nav><button id="start">NFCカードを読み取る</button><button id="home">スタッフメニューに戻る</button></nav><section><h2 id="screen">スタッフメニュー</h2><p id="customer">顧客未選択</p><div id="actions"></div></section><button id="run">自動テストを実行</button><pre id="results">未実行</pre><script>(()=>{'use strict';let screen='home',customer=null;const $=id=>document.getElementById(id),labels={home:'スタッフメニュー',scan:'NFC読取',customer:'お客様情報',award:'ポイント付与',use:'ポイント利用',history:'お客様別履歴'};function transition(next){if(next==='scan'||next==='home')customer=null;if(!labels[next])throw Error('unknown screen');if(['customer','award','use','history'].includes(next)&&!customer)throw Error('customer required');screen=next;render()}function select(id){if(screen!=='scan')throw Error('scan required');customer=id;screen='customer';render()}function render(){$('screen').textContent=labels[screen];$('customer').textContent=customer?'選択中: '+customer:'顧客未選択';const a=$('actions');a.replaceChildren();const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);a.append(b)};if(screen==='scan'){add('テスト顧客Aを読み取った想定',()=>select('テスト顧客A'));add('テスト顧客Bを読み取った想定',()=>select('テスト顧客B'))}if(screen==='customer'){add('付与画面',()=>transition('award'));add('利用画面',()=>transition('use'));add('履歴を見る',()=>transition('history'));add('別のカード',()=>transition('scan'))}if(['award','use','history'].includes(screen)){add('お客様情報へ戻る',()=>transition('customer'));add('別のカード',()=>transition('scan'))}if(screen==='history')add('この画面の履歴は固定モック（実データなし）',()=>{})}function test(){let pass=0;const logs=[];function check(label,fn){try{fn();logs.push('PASS '+label);pass++}catch(e){logs.push('FAIL '+label+': '+e.message)}}check('読取開始時に選択解除',()=>{transition('scan');if(customer!==null)throw Error('stale customer')});check('顧客A選択',()=>{select('テスト顧客A');if(customer!=='テスト顧客A')throw Error('A missing')});check('顧客Aのみ履歴',()=>{transition('history');if(customer!=='テスト顧客A')throw Error('wrong customer')});check('別カードで選択解除',()=>{transition('scan');if(customer!==null)throw Error('A persisted')});check('顧客B選択',()=>{select('テスト顧客B');transition('history');if(customer!=='テスト顧客B')throw Error('B missing')});check('ホーム復帰時に選択解除',()=>{transition('home');if(customer!==null)throw Error('B persisted')});check('顧客なしで操作不可',()=>{let blocked=false;try{transition('award')}catch(e){blocked=true}if(!blocked)throw Error('unguarded')});$('results').textContent=pass+'/7 合格\n'+logs.join('\n')} $('start').onclick=()=>transition('scan');$('home').onclick=()=>transition('home');$('run').onclick=test;render()})();</script>
