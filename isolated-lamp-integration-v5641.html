<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEES v5.6.41 隔離営業ランプ結合テスト</title><style>body{font:16px system-ui;max-width:680px;margin:25px auto;padding:15px;background:#17191e;color:white}input,button{font:inherit;padding:11px;margin:6px 0;box-sizing:border-box}input:not([type=checkbox]),button{width:100%}button{background:#ffd05c;border:0;border-radius:7px}button:disabled{opacity:.4}pre{background:#30333c;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bbb}</style><h2>🐝 隔離DB 営業ランプ結合テスト</h2><p>隔離環境だけに接続します。更新すると隔離DBに履歴が残ります。本番には接続しません。</p><form id="login"><input id="email" type="email" placeholder="隔離テストスタッフのメール" required><input id="password" type="password" placeholder="隔離テスト用パスワード" required><button>ログイン・権限確認</button></form><p id="who">未認証</p><button id="read">お客様向け公開状態を取得</button><fieldset id="write" disabled><legend>隔離テスト店舗の更新</legend><p>認証されたスタッフの担当店舗に限定。管理者でも別店舗は選べません。</p><label><input id="confirm" type="checkbox">この隔離店舗を変更し、操作履歴が残ることを承認する</label><div><button type="button" data-state="OPEN">OPEN 営業中</button><button type="button" data-state="AWAY">AWAY 一時不在</button><button type="button" data-state="CLOSE">CLOSE 営業終了</button></div></fieldset><button id="logout" disabled>ログアウト</button><pre id="out" role="status">未実行</pre><small>パスワードとトークンは保存しません。ブラウザを閉じるとログイン状態は失われます。</small><script type="module">
import {ISOLATED_URL,ISOLATED_PUBLISHABLE_KEY,assertIsolatedEndpoint,isolatedRpc} from './common/isolated_lamp_client_v5641.js';
import {VERIFIED_DEMO_STORE,canOperateDemoLamp,assertDemoLampWrite} from './common/isolated_demo_lamp_guard_v5641.js';
const el=id=>document.getElementById(id);let token=null,store=null,verifiedProfile=null,busy=false,authBusy=false;const output=v=>el('out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
const clear=()=>{token=null;store=null;verifiedProfile=null;el('write').disabled=true;el('confirm').checked=false;el('logout').disabled=true;el('who').textContent='未認証'};
el('login').onsubmit=async e=>{e.preventDefault();if(busy||authBusy||token)return;authBusy=true;el('login').querySelector('button').disabled=true;clear();const email=el('email').value.trim(),password=el('password').value;el('password').value='';try{const res=await fetch(assertIsolatedEndpoint(ISOLATED_URL)+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ISOLATED_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await res.json();if(!res.ok||!data.access_token)throw Error(data.error_description||data.msg||data.message||'認証失敗');token=data.access_token;const profile=await isolatedRpc('staff_lamp_my_profile_v5641',token);if(!canOperateDemoLamp(profile))throw Error('デモ用店舗の操作権限が確認できません。更新は禁止です');verifiedProfile=profile;store=VERIFIED_DEMO_STORE;el('who').textContent='隔離店舗: '+store+' / 権限: '+profile.role;el('write').disabled=false;el('logout').disabled=false;output('認証と店舗権限の確認完了。更新は明示的なチェック後のみ。')}catch(err){const rejected=token;clear();if(rejected){try{await fetch(assertIsolatedEndpoint(ISOLATED_URL)+'/auth/v1/logout',{method:'POST',headers:{apikey:ISOLATED_PUBLISHABLE_KEY,Authorization:'Bearer '+rejected}})}catch{}}output('認証確認失敗: '+err.message)}finally{authBusy=false;el('login').querySelector('button').disabled=false}};
el('read').onclick=async()=>{try{output({public:await isolatedRpc('public_store_operating_status_v5640',null),demo:await isolatedRpc('demo_public_lamp_status_v5641',null)})}catch(e){output('読み取り失敗: '+e.message)}};
for(const btn of document.querySelectorAll('[data-state]'))btn.onclick=async()=>{if(busy||authBusy||!token||!canOperateDemoLamp(verifiedProfile)||store!==VERIFIED_DEMO_STORE||!el('confirm').checked)return;const state=btn.dataset.state;const args=assertDemoLampWrite(verifiedProfile,store,state,el('confirm').checked);if(!confirm('隔離DBの店舗 '+store+' を '+state+' に変更し、監査履歴を追加します。実行しますか？'))return;busy=true;el('write').disabled=true;try{const changed=await isolatedRpc('staff_set_store_operating_status_v5640',token,args);let publicStatus,demoStatus;try{publicStatus=await isolatedRpc('public_store_operating_status_v5640',null);demoStatus=await isolatedRpc('demo_public_lamp_status_v5641',null)}catch(readError){output({changed,requested:state,verified:false,message:'更新RPCは成功しましたが、お客様表示の取得に失敗しました。再操作せず読み取り確認してください',readError:readError.message});return;}const customer=Array.isArray(demoStatus)?demoStatus.find(x=>x.slug==='demo-test-store'):null;const storeStatus=Array.isArray(publicStatus)?publicStatus.find(x=>x.store_id===VERIFIED_DEMO_STORE):null;const verified=customer?.status===state&&storeStatus?.status===state;output({changed,requested:state,customerStatus:customer?.status??null,storeStatus:storeStatus?.status??null,verified,message:verified?'スタッフ操作とお客様表示の一致を確認':'更新結果とお客様表示が一致しません。営業日境界・権限・履歴を確認してください'})}catch(e){output('更新失敗: '+e.message)}finally{busy=false;el('write').disabled=!token;el('confirm').checked=false}};
el('logout').onclick=async()=>{if(busy||authBusy)return;const old=token;clear();if(old){try{await fetch(assertIsolatedEndpoint(ISOLATED_URL)+'/auth/v1/logout',{method:'POST',headers:{apikey:ISOLATED_PUBLISHABLE_KEY,Authorization:'Bearer '+old}})}catch{}}output('ログアウト済み')};
</script></html>
