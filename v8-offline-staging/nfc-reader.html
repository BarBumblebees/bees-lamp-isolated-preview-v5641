<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><title>BEES POINT NFC｜NFCカード読取専用ページ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef5f1;color:#173e34;font-family:system-ui,-apple-system,sans-serif}header{background:#164b3c;color:#fff;padding:22px 18px}h1{font-size:23px;margin:0}header p{margin:8px 0 0}main{max-width:600px;margin:auto;padding:20px 16px}section{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px #173e3414}.warning{background:#fff2d4;border-left:5px solid #c98f18;padding:14px;border-radius:8px;line-height:1.7}button{display:block;width:100%;border:0;border-radius:12px;padding:16px;margin:12px 0;font:700 17px system-ui;cursor:pointer;background:#164b3c;color:#fff}button.secondary{background:#e7f0eb;color:#164b3c}button:disabled{opacity:.55;cursor:not-allowed}a{color:#164b3c}#status{min-height:50px;line-height:1.7}#result{background:#eef5f1;padding:15px;border-radius:10px;overflow-wrap:anywhere}#result[hidden]{display:none}.small{font-size:13px;color:#52665d;line-height:1.8}</style></head>
<body><header><h1>BEES POINT NFC</h1><p>NFCカード読取専用ページ · v5.6.41 隔離版</p></header><main><p class="warning">このページは実カードの<strong>読み取りだけ</strong>に対応します。会員照会・カード登録・ポイント付与・会計は実行しません。カードの秘密URLは表示・保存・送信しません。</p>
<section><h2>カードを読み取る</h2><p class="small">Android版Chromeで開き、開始後にNFCカードをスマホ背面へ近づけてください。</p><button id="start" type="button">NFCカードを読み取る</button><button id="stop" class="secondary" type="button" disabled>読み取りを停止</button><p id="status" role="status" aria-live="polite">開始ボタンを押してください。</p><div id="result" hidden role="status"><strong id="resultTitle"></strong><p id="resultText"></p></div></section>
<section><h2>次の操作</h2><p class="small">既存の登録・ポイント操作はスタッフ画面で行います。この隔離版からカードURLを自動転送しません。</p><a href="./staff.html">← スタッフ画面に戻る</a></section></main>
<script>(()=>{'use strict';const start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),result=document.getElementById('result');let controller=null;function end(){if(controller){controller.abort();controller=null}start.disabled=false;stop.disabled=true}function show(title,message){document.getElementById('resultTitle').textContent=title;document.getElementById('resultText').textContent=message;result.hidden=false}function validCardUrl(raw){try{const u=new URL(raw);return u.protocol==='https:'&&u.hostname==='shop-point-nfc-customer-test-1107.pages.dev'}catch{return false}}stop.addEventListener('click',()=>{end();status.textContent='読み取りを停止しました。'});start.addEventListener('click',async()=>{if(!('NDEFReader' in window)){status.textContent='Web NFC非対応です。Android版ChromeとNFC対応端末をご利用ください。';return}end();result.hidden=true;controller=new AbortController();const current=controller;start.disabled=true;stop.disabled=false;status.textContent='読み取りを準備しています…';try{const reader=new NDEFReader();reader.onreadingerror=()=>{status.textContent='カードを読み取れませんでした。もう一度かざしてください。'};reader.onreading=e=>{if(current.signal.aborted)return;let matched=false;for(const record of e.message.records){if(record.recordType!=='url'&&record.recordType!=='absolute-url')continue;try{const raw=record.recordType==='absolute-url'&&record.mediaType?record.mediaType:new TextDecoder().decode(record.data);if(validCardUrl(raw)){matched=true;break}}catch{}}end();if(matched){status.textContent='カードの読み取りが完了しました。';show('BEES POINT NFCカードを検出','カードURLのドメインを確認しました。秘密のカード情報は表示・保存していません。')}else{status.textContent='対応するカードURLを確認できませんでした。';show('未確認のカード','このページでは登録済みかどうかは判定できません。')}};await reader.scan({signal:current.signal});if(!current.signal.aborted)status.textContent='読み取り待機中。カードをスマホ背面にかざしてください。'}catch(e){if(e.name!=='AbortError')status.textContent='読み取りを開始できません：'+(e.name==='NotAllowedError'?'NFCの許可を確認してください。':'端末のNFC設定をご確認ください。');end()}});window.addEventListener('pagehide',end)})();</script></body></html>
