<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cuoruflxfyubjpboqprb.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"><title>BEES POINT NFC｜隔離・会員照会読取専用</title><style>body{font:16px/1.65 system-ui,sans-serif;background:#eef4ee;color:#173d2b;margin:0}main{max-width:560px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:14px;margin:14px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;border-radius:8px}input{border:1px solid #9db6a5}button{background:#174b3a;color:white;border:0}button:disabled{opacity:.45}#result{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block}.hidden{display:none}</style></head><body><main><h1>🐝 隔離・会員照会専用</h1><p>スタッフ認証後、NFCカードの会員情報を読取専用APIで確認します。ポイント操作・会計・会員データ更新はありません。認証情報・カードURLは保存・記録しません。</p><section id="login"><h2>スタッフログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">隔離環境でログイン</button></section><section><p id="status" role="status" aria-live="polite">未ログイン</p><button id="scan" disabled>NFCカードを読み取って会員照会</button><button id="logout" disabled>ログアウト・画面消去</button><div id="result" aria-live="polite"></div></section><small>ログインはSupabaseの正規認証APIを使用。会員照会は staff_prepared_card_status / staff_card_details_v3 のみ。カード番号や個人情報は画面を閉じると消去されます。共有端末では必ずログアウトしてください。</small></main><script src="./common/bees_nfc_reader.js"></script><script>(()=>{'use strict';const BASE='https://cuoruflxfyubjpboqprb.supabase.co',KEY='sb_publishable_EdoSdDxZAEeXDKzuN9gVDg_ThW89nz8';const $=id=>document.getElementById(id);let access=null,expiry=0,day=null,scanner=null,epoch=0;const today=()=>new Date(Date.now()+3600000).toISOString().slice(0,10);const headers=()=>({'apikey':KEY,'Authorization':'Bearer '+access,'Content-Type':'application/json'});function clear(){epoch++;if(scanner){scanner.stop();scanner=null}access=null;expiry=0;day=null;$('result').replaceChildren();$('scan').disabled=true;$('logout').disabled=true;$('login').classList.remove('hidden');$('password').value='';$('status').textContent='未ログイン'}function valid(raw){try{const u=new URL(raw);if(u.protocol!=='https:'||u.hostname!=='shop-point-nfc-customer-test-1107.pages.dev'||u.port||u.search||u.username||u.password||!['/','/index.html'].includes(u.pathname))return null;return /^#card=([A-Za-z0-9_-]{43})$/.exec(u.hash)?.[1]||null}catch(_){return null}}async function rpc(name,body){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('認証または会員照会エラー ('+r.status+')');return r.json()}function authorized(){return access&&expiry>Date.now()/1000+30&&day===today()}$('signIn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return;$('signIn').disabled=true;$('status').textContent='スタッフ認証中…';try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});const d=await r.json();if(!r.ok||!d.access_token)throw Error('ログイン失敗');access=d.access_token;expiry=Number(d.expires_at)||Math.floor(Date.now()/1000)+Number(d.expires_in||3600);day=today();await rpc('staff_card_stock_stores',{});$('email').value='';$('password').value='';$('login').classList.add('hidden');$('scan').disabled=false;$('logout').disabled=false;$('status').textContent='スタッフ認証完了。NFC読取が可能です。'}catch(_){clear();$('status').textContent='認証に失敗しました。スタッフ権限・営業日を確認してください。'}finally{$('signIn').disabled=false}};$('scan').onclick=async()=>{if(!authorized()){clear();$('status').textContent='認証の期限切れです。再ログインしてください。';return}if(scanner){scanner.stop();scanner=null}const mine=++epoch;$('result').replaceChildren();$('scan').disabled=true;$('status').textContent='NFCカードをかざしてください';try{const s=BeesNfcReader.start({validate:v=>!!valid(v),onCard:async raw=>{if(mine!==epoch)return;s.stop();scanner=null;const card=valid(raw);if(!card||!authorized()){clear();return}try{$('status').textContent='会員照会中…';const state=await rpc('staff_prepared_card_status',{p_card_token:card});if(mine!==epoch)return;if(state!=='active'){$('status').textContent=state==='prepared'?'未登録カードです': '有効なカードではありません';return}const d=await rpc('staff_card_details_v3',{p_card_token:card});if(mine!==epoch)return;if(!authorized()||!d||d.status!=='active'||!d.member_id||typeof d.display_name!=='string'||!Number.isFinite(Number(d.balance)))throw Error('不正な応答');const name=document.createElement('h2'),balance=document.createElement('p'),meta=document.createElement('p');name.textContent=d.display_name+' 様';balance.textContent='共通残高 '+Number(d.balance).toLocaleString('ja-JP')+'pt';meta.textContent='カード No.'+(d.card_number||'不明')+' / 発行店舗 '+(d.issued_store_name||'不明');$('result').replaceChildren(name,balance,meta);$('status').textContent='読取専用の会員照会が完了しました。'}catch(_){$('status').textContent='会員照会に失敗しました。'}finally{if(mine===epoch&&authorized())$('scan').disabled=false}},onError:msg=>{if(mine===epoch){$('status').textContent=msg;$('scan').disabled=false}}});scanner=s;await s.ready}catch(_){if(mine===epoch){$('status').textContent='NFC開始に失敗しました。Android Chromeを確認してください。';$('scan').disabled=false}}};$('logout').onclick=clear;document.addEventListener('visibilitychange',()=>{if(document.hidden){clear()}});window.addEventListener('pagehide',clear)})();</script></body></html>
