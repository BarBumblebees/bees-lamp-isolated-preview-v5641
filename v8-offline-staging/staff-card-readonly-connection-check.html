<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cuoruflxfyubjpboqprb.supabase.co; form-action 'none'; base-uri 'none'"><title>BEES POINT NFC｜読取専用・接続準備</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#eef5f0;color:#173d2b;max-width:620px;margin:auto;padding:20px}main{background:white;border-radius:16px;padding:24px}button{font:inherit;padding:14px;border:0;border-radius:10px;background:#17513b;color:white;width:100%}#result{background:#fff1cc;padding:14px;border-radius:10px;white-space:pre-wrap}</style></head><body><main><h1>🐝 会員照会・読取専用接続チェック</h1><p>既存スタッフ認証の有無のみを確認します。カードの秘密情報は取得・表示・保存しません。ポイント更新・会計・DB書き込みはありません。</p><button id="check">認証状態を確認</button><p id="result" role="status">未確認</p><small>公開サイトとはオリジンが異なるため、本番スタッフ画面のログイン状態は自動で引き継がれません。認証情報の貼り付けや入力はしないでください。</small></main><script>(()=>{'use strict';const key='shop-point-nfc.staff-session.v4',result=document.getElementById('result'),btn=document.getElementById('check');btn.onclick=()=>{let session=null;try{session=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}const today=new Date(Date.now()+3600000).toISOString().slice(0,10);if(!session||!session.access_token||!session.refresh_token||session.business_day!==today||Number(session.expires_at)<=Date.now()/1000+30){result.textContent='この隔離ページには有効なスタッフセッションがありません。安全のため実DB照会は開始しません。\n本番画面のログイン情報をコピー・貼り付けしないでください。';return}result.textContent='同一オリジンの有効期限内スタッフセッションを検出しました。実会員照会はこのページでは実行しません。';};})();</script></body></html>
