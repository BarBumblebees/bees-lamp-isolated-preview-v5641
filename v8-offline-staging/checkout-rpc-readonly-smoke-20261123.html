<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cuoruflxfyubjpboqprb.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'"><title>BEES POINT NFC｜会計照合API読取接続テスト</title><style>body{font:16px/1.6 system-ui;background:#edf4ef;color:#173c2b;margin:0}main{max-width:550px;margin:auto;padding:20px}section{background:white;border-radius:14px;padding:18px;margin:15px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:7px 0;border-radius:8px}button{background:#17523c;color:white;border:0}button:disabled{opacity:.5}input{border:1px solid #9bad9f}pre{white-space:pre-wrap;overflow-wrap:anywhere}.note{background:#fff1cc;padding:12px;border-radius:8px}</style></head><body><main><h2>BEES POINT NFC</h2><h3>会計照合API・読取接続テスト</h3><p class="note">隔離プレビュー専用。会計・ポイントの書込機能はありません。ランダムな受付IDだけで照会します。会計未確認でも再送してよいという意味ではありません。</p><section><label>スタッフのメールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="login">スタッフログイン</button><button id="logout" disabled>ログアウト</button><p id="auth" role="status">未ログイン</p></section><section><button id="test" disabled>会計照合APIの読取接続テスト</button><pre id="result" role="status">ログイン後に実行できます。</pre></section></main><script>(()=>{'use strict';const BASE='https://cuoruflxfyubjpboqprb.supabase.co',KEY='sb_publishable_EdoSdDxZAEeXDKzuN9gVDg_ThW89nz8';const $=id=>document.getElementById(id);let token=null;async function call(path,body,bearer){const r=await fetch(BASE+path,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+(bearer||KEY),'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error((data&&data.message)||('HTTP '+r.status));return data}function state(){ $('test').disabled=!token;$('logout').disabled=!token} $('login').onclick=async()=>{ $('auth').textContent='認証中…';try{const d=await call('/auth/v1/token?grant_type=password',{email:$('email').value.trim(),password:$('password').value});if(!d.access_token)throw Error('トークンが取得できません');token=d.access_token;$('password').value='';$('auth').textContent='認証成功。読取接続テストを実行できます。';}catch(e){token=null;$('auth').textContent='ログイン失敗: '+e.message}state()};$('logout').onclick=()=>{token=null;$('auth').textContent='ログアウトしました';$('result').textContent='ログイン後に実行できます。';state()};$('test').onclick=async()=>{if(!token)return;$('test').disabled=true;$('result').textContent='照会中…';try{const id=crypto.randomUUID();const d=await call('/rest/v1/rpc/staff_checkout_result_by_request_v1',{p_request_id:id},token);$('result').textContent=d&&d.status==='unconfirmed'?'接続成功：ランダム受付IDは未確認（想定どおり）。書込なし。':'想定外の応答：管理者に確認してください。';}catch(e){$('result').textContent='接続または権限エラー：'+e.message}finally{state()}}})();</script></body></html>
