<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'"><title>BEES POINT NFC｜スタッフカード読取専用</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf4ef;color:#183e2d;font:16px/1.6 system-ui,sans-serif}header{background:#174b3a;color:white;padding:18px}h1{font-size:22px;margin:0}main{max-width:600px;margin:0 auto;padding:16px}section{background:white;border-radius:14px;margin:14px 0;padding:18px;box-shadow:0 1px 8px #173e2814}button,a{font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#174b3a;color:white;margin:7px 0}button:disabled{opacity:.5}a{color:#174b3a}label{display:block;margin:12px 0}input{display:block;width:100%;padding:12px;border:1px solid #9db7a5;border-radius:8px}.notice{padding:12px;background:#fff2d2;border-radius:8px}#status{overflow-wrap:anywhere}#balance{font-size:23px;font-weight:700}#history>li{border-top:1px solid #dde8df;padding:7px 0}.hidden{display:none!important}</style></head>
<body><header><h1>カード読取専用</h1><small>BEES POINT NFC · スタッフ認証付き会員照会</small></header><main><p class="notice">隔離プレビューでは安全のためDB通信を遮断しています。実会員の照会はできません。ポイントの付与・利用・カード登録機能はありません。</p>
<section><h2>スタッフ認証</h2><p id="authStatus" role="status">ログイン状態を確認してください。</p><button id="checkLogin">ログイン状態を確認</button><p>認証が必要な場合は<a href="./staff.html">通常のスタッフ画面でログイン</a>してください。</p></section>
<section><h2>NFCカード照会</h2><button id="start" disabled>カードを読み取る</button><button id="stop" disabled>読み取り停止</button><details><summary>カードURLを入力して照会</summary><label>カードURL<input id="cardUrl" type="password" autocomplete="off" spellcheck="false"></label><button id="lookup" disabled>照会する</button></details><p id="status" role="status" aria-live="polite">スタッフ認証後に利用できます。</p></section>
<section id="member" class="hidden" aria-live="polite"><h2 id="name"></h2><p id="balance"></p><p id="metadata"></p><h3>直近の利用履歴</h3><ul id="history"></ul></section><p><a href="./staff.html">通常のスタッフ画面へ戻る</a></p></main>
<script src="./common/bees_nfc_reader.js"></script><script src="./common/staff_card_reader.js"></script></body></html>
